[project]
name = "cesta-solidaria"
version = "1.0.0"
description = "Sistema de gestao de cestas basicas para projetos sociais"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    # SVGs, base64 e f-strings HTML nao quebram sem perder legibilidade.
    "E501",
    # assert em testes eé esperado (pytest).
    "S101",
    # Lazy imports para evitar dependencias circulares.
    "PLC0415",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]
